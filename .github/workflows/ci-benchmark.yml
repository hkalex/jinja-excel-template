name: CI — Tests & Benchmarks

on:
  push:
    branches: [ main, 001-calculated-cell ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pytest-benchmark openpyxl lxml jinja2 python-dateutil Pillow
      - name: Run tests
        run: pytest -q
  benchmark:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pytest-benchmark openpyxl lxml jinja2 python-dateutil Pillow
      - name: Run benchmarks
        run: |
          pytest tests/benchmark_formula_eval.py -q --benchmark-json=bench.json
      - name: Check benchmarks
        run: |
          python scripts/ci/benchmark_check.py bench.json --gen-threshold 2.0 --eval-threshold 0.01
